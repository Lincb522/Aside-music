function show(i){selected=i;const s=sheets[i];select.value=i;document.getElementById('heading').textContent=s.id+' / 12 · '+s.title;document.getElementById('previous').disabled=i===0;document.getElementById('next').disabled=i===11;document.getElementById('status').hidden=true;const grid=document.getElementById('grid');grid.replaceChildren();s.icons.forEach((icon,n)=>{const figure=document.createElement('figure');figure.className='item';const pair=document.createElement('div');pair.className='pair';['light','dark'].forEach(appearance=>{const a=document.createElement('a');a.className='tile '+appearance;a.href='Assets/'+appearance+'/'+icon.name+'.png';a.download=icon.name+(appearance==='dark'?'_light':'_dark')+'.png';a.setAttribute('aria-label','下载'+icon.label+(appearance==='dark'?'浅色图标':'深色图标'));const img=document.createElement('img');img.src=a.href;img.alt=icon.label+(appearance==='dark'?'，浅色':'，深色');img.width=128;img.height=128;img.onerror=()=>{const status=document.getElementById('status');status.textContent='图标加载失败，请刷新页面。';status.hidden=false};a.append(img);pair.append(a)});const caption=document.createElement('figcaption');const position=document.createElement('span');position.className='position';position.textContent=(Math.floor(n/5)+1)+'–'+(n%5+1);caption.append(position,icon.label);figure.append(pair,caption);grid.append(figure)});[...nav.children].forEach((b,n)=>b.setAttribute('aria-current',n===i?'true':'false'))}
select.onchange=()=>show(Number(select.value));document.getElementById('previous').onclick=()=>show(selected-1);document.getElementById('next').onclick=()=>show(selected+1);document.getElementById('size').onchange=e=>{document.documentElement.style.setProperty('--icon-size',e.target.value+'px');document.body.classList.toggle('large',e.target.value==='128')};document.getElementById('guides').onchange=e=>document.body.classList.toggle('guides',e.target.checked);show(0);
