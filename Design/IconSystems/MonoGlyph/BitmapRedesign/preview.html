<script>
const sheets=JSON.parse(document.getElementById('sheet-data').textContent);
const picker=document.getElementById('sheet-picker');
const nav=document.getElementById('sheet-nav');
const artwork=document.getElementById('artwork');
let selected=0;
sheets.forEach((sheet,i)=>{
  const option=document.createElement('option');option.value=String(i);option.textContent=sheet.id+' · '+sheet.title;picker.append(option);
  const button=document.createElement('button');button.type='button';button.textContent=sheet.id;button.setAttribute('aria-label','图板 '+sheet.id+'，'+sheet.title);button.addEventListener('click',()=>show(i));nav.append(button);
});
function show(i){
  selected=i;const sheet=sheets[i];picker.value=String(i);
  artwork.width=sheet.width;artwork.height=sheet.height;artwork.src=sheet.file;artwork.alt=sheet.title+'，'+sheet.icons.length+' 个图标，按行从左至右排列';
  document.getElementById('original').href=sheet.file;
  document.getElementById('download-sheet').href=sheet.file;
  document.getElementById('caption').textContent=sheet.id+' / 12 · '+sheet.title;
  document.getElementById('previous').disabled=i===0;document.getElementById('next').disabled=i===sheets.length-1;
  const index=document.getElementById('icon-index');index.replaceChildren();
  sheet.icons.forEach((icon,n)=>{
    const li=document.createElement('li');const position=document.createElement('span');position.className='position';position.textContent=String(Math.floor(n/5)+1)+'–'+String(n%5+1);
    const name=document.createElement('span');name.className='name';name.textContent=icon.label;li.append(position,name);index.append(li);
  });
  [...nav.children].forEach((button,n)=>button.setAttribute('aria-current',n===i?'true':'false'));
}
picker.addEventListener('change',()=>show(Number(picker.value)));
document.getElementById('previous').addEventListener('click',()=>show(selected-1));
document.getElementById('next').addEventListener('click',()=>show(selected+1));
show(0);
</script>
