<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Generated at 2025-05-23T10:30:00Z - Subtle Shadow -->
  <defs>
    <!-- Background: Diagonal Gradient (Top-Left to Bottom-Right) -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="20%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E5E5EA" />
    </linearGradient>
    
    <!-- Subtle/Light Shadow for the Headphones -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <!-- Smaller offset and blur for a "slight" effect -->
      <feOffset dx="0" dy="8" result="offset" />
      <feGaussianBlur in="offset" stdDeviation="8" result="blur" />
      <feComponentTransfer>
        <!-- Lower opacity (0.15) for a lighter touch -->
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1024" height="1024" fill="url(#bgGradient)" />

  <!-- 2. The Icon -->
  <g transform="translate(512 520)" filter="url(#subtleShadow)">
      
    <!-- Headphones (Solid Black) -->
    <g fill="#111111">
        <!-- Headband -->
        <path d="M -360 -40 
                 C -360 -280, -200 -420, 0 -420 
                 C 200 -420, 360 -280, 360 -40 
                 L 360 20 
                 L 280 20 
                 L 280 -40 
                 C 280 -220, 160 -340, 0 -340 
                 C -160 -340, -280 -220, -280 -40 
                 L -280 20 
                 L -360 20 Z" />
                 
        <!-- Left Ear Cup -->
        <path d="M -400 -20 
                 L -240 -20 
                 C -230 -20, -220 -10, -220 0 
                 L -220 220 
                 C -220 260, -260 300, -300 300 
                 H -340 
                 C -380 300, -420 260, -420 220 
                 L -420 0 
                 C -420 -10, -410 -20, -400 -20 Z" />
        
        <!-- Right Ear Cup -->
        <path d="M 240 -20 
                 L 400 -20 
                 C 410 -20, 420 -10, 420 0 
                 L 420 220 
                 C 420 260, 380 300, 340 300 
                 H 300 
                 C 260 300, 220 260, 220 220 
                 L 220 0 
                 C 220 -10, 230 -20, 240 -20 Z" />
                 
        <!-- Subtle Detail: Glossy Reflection -->
        <circle cx="-320" cy="140" r="40" fill="#FFFFFF" opacity="0.1" />
        <circle cx="320" cy="140" r="40" fill="#FFFFFF" opacity="0.1" />
    </g>
    
    <!-- Soundwaves (Grayscale Hierarchy) -->
    <g>
        <!-- Center Bar: Pure Black -->
        <rect x="-30" y="-80" width="60" height="320" rx="30" fill="#000000" />
        
        <!-- Side Bars: Dark Gray -->
        <rect x="-140" y="-10" width="60" height="180" rx="30" fill="#555555" />
        <rect x="80" y="-10" width="60" height="180" rx="30" fill="#555555" />
        
        <!-- Outer Dots: Light Gray -->
        <circle cx="-190" cy="80" r="15" fill="#AAAAAA" />
        <circle cx="190" cy="80" r="15" fill="#AAAAAA" />
    </g>
    
  </g>

</svg>