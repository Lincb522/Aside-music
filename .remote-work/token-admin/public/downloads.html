<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monologue 下载</title>
  <link rel="icon" href="./brand-mark.png">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body>
  <main class="public-shell">
    <header class="public-masthead">
      <div class="brand-lockup brand-lockup--compact">
        <img src="./brand-mark.png" alt="Monologue" loading="eager" decoding="async" fetchpriority="high">
        <div class="brand-copy">
          <small>Monologue</small>
          <h1>版本下载</h1>
        </div>
      </div>
      <a class="btn btn-secondary" href="./">返回后台</a>
    </header>

    <section class="public-hero">
      <div class="page-hero-copy">
        <small class="eyebrow">Release Notes</small>
        <h2>下载</h2>
      </div>
    </section>

    <section class="panel panel--public">
      <div class="panel-head">
        <div>
          <small class="eyebrow">Featured</small>
          <h3>最新版本</h3>
        </div>
      </div>
      <div id="latestRelease" class="download-feature"></div>
    </section>

    <section class="panel panel--public">
      <div class="panel-head">
        <div>
          <small class="eyebrow">Archive</small>
          <h3>历史版本</h3>
        </div>
      </div>
      <div id="releaseArchive" class="archive-list"></div>
    </section>
  </main>

  <div id="toast" class="toast"></div>

  <script src="./assets/admin-core.js"></script>
  <script src="./assets/downloads-page.js"></script>
</body>
</html>
