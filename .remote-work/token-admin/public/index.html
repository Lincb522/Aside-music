<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monologue Console</title>
  <link rel="icon" href="./brand-mark.png">
  <link rel="stylesheet" href="./assets/admin.css">
</head>
<body>
  <div id="authGate" class="auth-gate hidden">
    <div class="auth-panel">
      <div class="brand-lockup">
        <img src="./brand-mark.png" alt="Monologue" loading="eager" decoding="async" fetchpriority="high">
        <div class="brand-copy">
          <small>Monologue Console</small>
          <h1>管理入口</h1>
          <p>输入管理密码。</p>
        </div>
      </div>
      <div class="form-stack">
        <div class="field">
          <label for="loginPassword">管理密码</label>
          <input id="loginPassword" type="password" placeholder="输入密码">
        </div>
        <div id="loginError" class="error-text"></div>
        <button id="loginButton" class="btn btn-primary">进入</button>
      </div>
    </div>
  </div>

  <div id="appShell" class="shell hidden">
    <header class="masthead">
      <div class="brand-lockup brand-lockup--compact">
        <img src="./brand-mark.png" alt="Monologue" loading="eager" decoding="async" fetchpriority="high">
        <div class="brand-copy">
          <small>Monologue Console</small>
          <h1>首页</h1>
        </div>
      </div>
      <nav class="main-nav">
        <a class="is-active" href="./">首页</a>
        <a href="./tokens">Token 管理</a>
        <a href="./ipa">IPA 管理</a>
      </nav>
      <div class="masthead-actions">
        <a class="btn btn-secondary" href="./downloads" target="_blank" rel="noreferrer">下载页</a>
        <button id="logoutButton" class="btn btn-ghost">退出</button>
      </div>
    </header>

    <main class="page">
      <section class="page-hero">
        <div class="page-hero-copy">
          <small class="eyebrow">Overview</small>
          <h2>总览</h2>
          <div class="hero-inline-stats">
            <article class="hero-stat">
              <span>当前发布</span>
              <strong id="latestReleaseVersion">—</strong>
            </article>
            <article class="hero-stat">
              <span>已同步 Token</span>
              <strong id="cloudSyncCount">0</strong>
            </article>
            <article class="hero-stat">
              <span>总下载</span>
              <strong id="heroDownloads">0</strong>
            </article>
          </div>
        </div>
        <aside class="panel hero-side">
          <div class="panel-head">
            <div>
              <small class="eyebrow">Status</small>
              <h3>当前状态</h3>
            </div>
          </div>
          <div id="statusList" class="status-list"></div>
        </aside>
      </section>

      <section class="summary-strip">
        <article class="summary-tile">
          <span>活跃 Token</span>
          <strong id="statActive">0</strong>
        </article>
        <article class="summary-tile">
          <span>总请求</span>
          <strong id="statRequests">0</strong>
        </article>
        <article class="summary-tile">
          <span>版本数</span>
          <strong id="statReleases">0</strong>
        </article>
        <article class="summary-tile">
          <span>已发布</span>
          <strong id="statPublished">0</strong>
        </article>
        <article class="summary-tile">
          <span>下载总量</span>
          <strong id="statDownloads">0</strong>
        </article>
      </section>

      <section class="workspace-grid workspace-grid--two">
        <article class="panel">
          <div class="panel-head">
            <div>
              <small class="eyebrow">Tokens</small>
              <h3>近期 Token</h3>
            </div>
            <a class="btn btn-secondary btn-small" href="./tokens">进入管理</a>
          </div>
          <div id="tokenOverview" class="feature-stack"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <div>
              <small class="eyebrow">Releases</small>
              <h3>近期版本</h3>
            </div>
            <a class="btn btn-secondary btn-small" href="./ipa">进入管理</a>
          </div>
          <div id="releaseOverview" class="feature-stack"></div>
        </article>
      </section>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script src="./assets/admin-core.js"></script>
  <script src="./assets/dashboard-page.js"></script>
</body>
</html>
